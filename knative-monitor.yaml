kind: ServiceMonitor
apiVersion: monitoring.coreos.com/v1
metadata:
  name: otel-collector-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
    - port: prometheus
      interval: 15s
      path: /metrics